name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Swift tests (ApmulyCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: Packages/ApmulyCore
        run: swift test

  renderer-tests:
    name: Renderer tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test 'App/RendererTests/*.test.mjs'
